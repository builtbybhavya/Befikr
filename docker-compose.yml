version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nirikshak-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nirikshak_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nirikshak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nirikshak-backend
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/nirikshak_db
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nirikshak-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgis_data:
